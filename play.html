<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Emoji Bible Guess</title>

<style>
* { -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #2b5876, #4e4376);
  color: white;
  height: 100vh;
  height: 100dvh; 
  overflow: hidden;
  box-sizing: border-box;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}

#app {
  max-width: 500px;
  margin: auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); 
  padding-left: calc(20px + env(safe-area-inset-left));
  padding-right: calc(20px + env(safe-area-inset-right));
  box-sizing: border-box;
}

.screen { 
  display: none; 
  flex-direction: column; 
  height: 100%; 
  justify-content: space-between; 
}
.show { display: flex; }

h1 { 
  text-align: center; 
  margin-top: 15px; 
  margin-bottom: 10px;
  font-size: 28px;
}

.card {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  box-sizing: border-box;
}

#start {
  justify-content: center;
}
#start .card {
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 15px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  touch-action: manipulation;
}

.primary { background: #00c853; color: white; }
.secondary { background: #ffca28; color: black; }
.blue { background: #2196f3; color: white; }
.red { background: #e53935; color: white; }
.purple { background: #9c27b0; color: white; }
.brown { background: #795548; color: white; }
.grey { background: #757575; color: white; }

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  box-sizing: border-box;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: white;
  color: black;
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-sizing: border-box;
}
.modal-box h2 { margin-top: 0; }
.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
}

/* TOP HEADER INFO BAR */
.info {
  display: flex;
  justify-content: space-between;
  font-size: 26px;
  font-weight: bold;
  padding-top: 10px;
}

#teamScoreboard {
  display: none;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 6px;
}
#teamScoreboard .ts-current {
  color: #00c853;
  text-decoration: underline;
}

/* CENTERED PLAY AREA */
.game-center-container {
  flex: 1;
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 55px;
  font-weight: bold;
  text-align: center;
  min-height: 0;
}

#emoji {
  display: inline-block;
}

#hint {
  display: block;
  width: 100%;
  font-size: 22px;
  font-weight: normal;
  opacity: 0.85;
  margin-top: 4px;
}

#bookName {
  font-size: 46px;
  font-weight: bold;
  text-align: center;
}

.feedback-text {
  font-size: 26px;
  font-weight: bold;
  text-align: center;
  margin-top: 14px;
  min-height: 32px;
}

.quiz-question {
  font-size: 34px;
  font-weight: bold;
  text-align: center;
  line-height: 1.3;
}

.quiz-header {
  font-size: 16px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.75;
  margin-bottom: 8px;
}

.quiz-detail {
  font-size: 18px;
  font-weight: normal;
  opacity: 0.85;
  margin-top: 8px;
  line-height: 1.35;
}

#quizName.quiz-statement {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.4;
}

.quiz-options .footer {
  margin-bottom: 12px;
}
.quiz-options button {
  font-size: 17px;
  white-space: normal;
  line-height: 1.2;
}

#triviaRoundBanner {
  display: none;
  text-align: center;
  margin-bottom: 14px;
}
#roundOwnerLabel {
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  opacity: 0.75;
}
#answeringLabel {
  font-size: 22px;
  font-weight: bold;
  margin-top: 3px;
}
#answeringLabel.steal {
  color: #ffca28;
}
#questionProgress {
  font-size: 13px;
  opacity: 0.7;
  margin-top: 3px;
}
#betweenRecap {
  font-size: 15px;
  opacity: 0.85;
  margin-top: -6px;
  margin-bottom: 14px;
}

#clue {
  display: inline-block;
  font-size: 55px;
}

/* BOTTOM BUTTON CONTAINER STACK */
.controls-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  margin-bottom: 5px;
  flex-shrink: 0;
}

.footer {
  display: flex;
  gap: 12px;
}
.footer button { flex: 1; }

select {
  width: 100%;
  padding: 12px;
  font-size: 16px; /* prevents iOS auto-zoom on focus */
  margin-top: 5px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-sizing: border-box;
}

table { width: 100%; margin-top: 15px; }
td { padding: 8px; font-size: 18px; }

/* ---------- Small phones ---------- */
@media (max-width: 359px), (max-height: 600px) {
  h1 { font-size: 22px; margin-top: 8px; }
  .info { font-size: 20px; }
  .game-center-container { font-size: 42px; }
  #clue { font-size: 42px; }
  #hint { font-size: 17px; }
  #bookName { font-size: 32px; }
  .feedback-text { font-size: 20px; }
  .quiz-question { font-size: 24px; }
  .quiz-header { font-size: 12px; margin-bottom: 5px; }
  .quiz-detail { font-size: 13px; margin-top: 5px; }
  #quizName.quiz-statement { font-size: 17px; }
  .quiz-options button { font-size: 14px; }
  #roundOwnerLabel { font-size: 11px; }
  #answeringLabel { font-size: 17px; }
  #questionProgress { font-size: 11px; }
  #teamScoreboard { font-size: 14px; gap: 8px; }
  button { padding: 13px; font-size: 17px; }
  .card { padding: 16px; }
}

/* ---------- Landscape phones (short viewport) ---------- */
@media (max-height: 480px) and (orientation: landscape) {
  #app { padding-top: calc(8px + env(safe-area-inset-top)); }
  h1 { font-size: 18px; margin: 4px 0; }
  .info { font-size: 18px; padding-top: 4px; }
  .game-center-container { font-size: 34px; gap: 6px; }
  #clue { font-size: 34px; }
  #hint { font-size: 15px; margin-top: 2px; }
  #bookName { font-size: 26px; }
  .feedback-text { font-size: 17px; margin-top: 6px; min-height: 22px; }
  .quiz-question { font-size: 19px; }
  .quiz-header { font-size: 11px; margin-bottom: 4px; }
  .quiz-detail { font-size: 12px; margin-top: 4px; }
  #quizName.quiz-statement { font-size: 15px; }
  .quiz-options button { font-size: 12px; padding: 8px; }
  #triviaRoundBanner { margin-bottom: 8px; }
  #roundOwnerLabel { font-size: 10px; }
  #answeringLabel { font-size: 14px; }
  #questionProgress { font-size: 10px; }
  #teamScoreboard { font-size: 13px; gap: 6px; margin-top: 2px; }
  .controls-container { gap: 8px; }
  button { padding: 10px; font-size: 15px; min-height: 40px; }
}

/* ---------- Tablet / iPad portrait and up ---------- */
@media (min-width: 600px) {
  #app { max-width: 620px; }
  h1 { font-size: 36px; margin-top: 20px; }
  .card { padding: 28px; border-radius: 24px; }
  .info { font-size: 32px; }
  .game-center-container { font-size: 80px; gap: 18px; }
  #clue { font-size: 80px; }
  #hint { font-size: 30px; margin-top: 8px; }
  #bookName { font-size: 64px; }
  .feedback-text { font-size: 34px; margin-top: 18px; min-height: 42px; }
  .quiz-question { font-size: 46px; }
  .quiz-header { font-size: 20px; margin-bottom: 12px; }
  .quiz-detail { font-size: 24px; margin-top: 12px; }
  #quizName.quiz-statement { font-size: 32px; }
  .quiz-options button { font-size: 22px; }
  #roundOwnerLabel { font-size: 18px; }
  #answeringLabel { font-size: 30px; }
  #questionProgress { font-size: 17px; }
  #teamScoreboard { font-size: 24px; gap: 20px; }
  button { padding: 20px; font-size: 24px; border-radius: 18px; }
  select { padding: 14px; font-size: 20px; }
  .controls-container { gap: 16px; }
  .footer { gap: 16px; }
  td { font-size: 20px; }
}

/* ---------- iPad landscape / large tablets ---------- */
@media (min-width: 900px) {
  #app { max-width: 720px; }
  .game-center-container { font-size: 100px; }
  #clue { font-size: 100px; }
  h1 { font-size: 42px; }
}
</style>
</head>

<body>
<div id="app">

<!-- START -->
<div id="start" class="screen show">
  <div>
    <h1>📖 Emoji Bible Guess</h1>
    <div class="card">
      <h2>Select Teams</h2>
      <select id="teams">
        <option value="individual">🙋 Individual</option>
        <option value="2">2 Teams</option>
        <option value="3">3 Teams</option>
        <option value="4">4 Teams</option>
        <option value="5">5 Teams</option>
      </select>

      <h2>Select Category</h2>
      <select id="category">
        <option value="mixed">🔀 Mixed</option>
        <option value="bible">📖 Bible Characters</option>
        <option value="feasts">🌿 Feasts & Events</option>
        <option value="stories">📜 Bible Stories</option>
        <option value="phrases">💬 Bible Phrases</option>
        <option value="funny">😂 Funny Sounds - Bible Characters</option>
        <option value="testament">📚 Old or New Testament?</option>
        <option value="trivia">🧠 Bible Trivia</option>
      </select>

      <button class="primary" onclick="startGame()">Start Game</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="info">
    <div>⏱ <span id="time">60</span></div>
    <div id="soloScoreWrap">⭐ <span id="score">0</span></div>
    <div id="teamInfo">🏆 T<span id="team">1</span></div>
  </div>
  <div id="teamScoreboard" style="display:none;"></div>
  <div id="categoryDisplay" style="text-align:center; font-size:14px; opacity:0.85; margin-top:2px;"></div>

  <div class="game-center-container" id="emojiCenter">
    <span id="emoji">📊</span>
    <span id="hint"></span>
    <span id="clue"></span>
  </div>

  <div class="game-center-container" id="testamentCenter" style="display:none; flex-direction:column;">
    <div id="bookName">Genesis</div>
    <div class="feedback-text" id="feedback"></div>
  </div>

  <div class="game-center-container" id="triviaCenter" style="display:none; flex-direction:column;">
    <div id="triviaRoundBanner">
      <div id="roundOwnerLabel"></div>
      <div id="answeringLabel"></div>
      <div id="questionProgress"></div>
    </div>
    <div class="quiz-question" id="triviaQuestion">
      <div class="quiz-header" id="quizHeader" style="display:none;"></div>
      <div id="quizName">Question</div>
      <div class="quiz-detail" id="quizDetail" style="display:none;"></div>
    </div>
    <div class="feedback-text" id="triviaFeedback"></div>
  </div>

  <div class="controls-container" id="emojiControls">
    <div class="footer">
      <button class="primary" onclick="correct()">✓ Correct</button>
      <button class="secondary" onclick="skip()">⏭ Skip</button>
    </div>
    <div class="footer">
      <button class="blue" onclick="revealAnswer()">👁️ Reveal Answer</button>
      <button class="purple" onclick="openCategoryModal()">🔀 Change Category</button>
    </div>
    <button class="red" onclick="endGame()">⛔ End Game</button>
  </div>

  <div class="controls-container" id="testamentControls" style="display:none;">
    <div class="footer">
      <button class="brown" onclick="answerTestament('old')">📜 Old Testament</button>
      <button class="blue" onclick="answerTestament('new')">✝️ New Testament</button>
    </div>
    <button class="purple" onclick="openCategoryModal()">🔀 Change Category</button>
    <button class="red" onclick="endGame()">⛔ End Game</button>
  </div>

  <div class="controls-container quiz-options" id="triviaControls" style="display:none;">
    <div class="footer">
      <button class="primary" id="opt0" onclick="answerTrivia(0)">Option 1</button>
      <button class="secondary" id="opt1" onclick="answerTrivia(1)">Option 2</button>
    </div>
    <div class="footer" id="optRow2">
      <button class="blue" id="opt2" onclick="answerTrivia(2)">Option 3</button>
      <button class="brown" id="opt3" onclick="answerTrivia(3)">Option 4</button>
    </div>
    <div class="footer">
      <button class="grey" onclick="openPauseModal()">⏸ Pause</button>
      <button class="purple" onclick="openCategoryModal()">🔀 Change Category</button>
    </div>
    <button class="red" onclick="endGame()">⛔ End Game</button>
  </div>
</div>

<!-- BETWEEN -->
<div id="between" class="screen" style="justify-content: center;">
  <h1>Team <span id="nextTeam">2</span></h1>
  <div id="betweenRecap"></div>
  <div class="card">
    <h2>Pass the phone 📱</h2>
    <button class="blue" onclick="nextTeam()">Start</button>
  </div>
</div>

<!-- CHANGE CATEGORY MODAL -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal-box">
    <h2>Change Category</h2>
    <select id="inGameCategory">
      <option value="mixed">🔀 Mixed</option>
      <option value="bible">📖 Bible Characters</option>
      <option value="feasts">🌿 Feasts & Events</option>
      <option value="stories">📜 Bible Stories</option>
      <option value="phrases">💬 Bible Phrases</option>
      <option value="funny">😂 Funny Sounds - Bible Characters</option>
      <option value="testament">📚 Old or New Testament?</option>
      <option value="trivia">🧠 Bible Trivia</option>
    </select>
    <div class="modal-actions">
      <button class="primary" onclick="applyCategoryChange()">Apply</button>
      <button class="secondary" onclick="cancelCategoryChange()">Cancel</button>
    </div>
  </div>
</div>

<!-- PAUSE MODAL -->
<div class="modal-overlay" id="pauseModal">
  <div class="modal-box">
    <h2>⏸ Paused</h2>
    <div id="pauseSummary" style="margin-bottom:14px; font-size:15px; opacity:0.85;"></div>
    <div class="modal-actions">
      <button class="primary" onclick="resumeGame()">▶ Resume</button>
    </div>
  </div>
</div>

<!-- END -->
<div id="end" class="screen" style="justify-content: center;">
  <h1>🏆 Game Over</h1>
  <div class="card">
    <h2 id="winner"></h2>
    <table id="results"></table>
    <button class="primary" onclick="location.reload()">Play Again</button>
  </div>
</div>

</div>

const ROUND_QUESTIONS_PER_TEAM = 5;

let teamCount = 2;
let isIndividual = false;
let team = 1;
let score = 0;
let time = 60;
let timer;
let used = [];
let scores = [];
let selectedCategory = "mixed";
let currentCard = null;
let currentBook = null;
let usedBooks = [];
let currentTrivia = null;
let triviaDeck = [];
let triviaPointer = 0;
let triviaTypeQueues = { mc: [], testament: [], tf: [] };
let triviaQueuesInitialized = false;
let roundQueue = [];
let roundQueuePointer = 0;
let roundQuestionCount = 0;
let stealPending = false;
let answeringTeamIndex = 0;
let gameElapsedSeconds = 0;
let gameTimer = null;
let stopwatchStarted = false;
let resolvedTriviaIds = new Set();

function startGame(){
  clearInterval(timer);
  clearInterval(gameTimer);
  stopwatchStarted = false;
  resolvedTriviaIds = new Set();

  const teamsValue = document.getElementById("teams").value;
  isIndividual = teamsValue === "individual";
  teamCount = isIndividual ? 1 : parseInt(teamsValue);
  selectedCategory = document.getElementById("category").value;
  scores = Array(teamCount).fill(0);
  team = 1;

  document.getElementById("start").classList.remove("show");
  document.getElementById("game").classList.add("show");

  if(isTriviaTeamRoundMode()){
    refillTypeQueues();
    roundQueue = [];
    roundQueuePointer = 0;
    startGameStopwatch();
  }

  startRound();
}

function getCards(){
  return selectedCategory === "mixed"
    ? cards
    : cards.filter(c => c.c === selectedCategory);
}

function startRound(){
  used = [];
  usedBooks = [];
  roundQuestionCount = 0;
  stealPending = false;
  answeringTeamIndex = team - 1;

  updateTeamDisplay();
  updateModeUI();

  if(isTriviaTeamRoundMode()){
    nextCard();
  } else {
    time = 60;
    score = 0;
    nextCard();
    resumeTimer();
  }
}

function isTestamentMode(){
  return selectedCategory === "testament";
}

function isTriviaMode(){
  return selectedCategory === "trivia";
}

function isTriviaTeamRoundMode(){
  return selectedCategory === "trivia" && !isIndividual;
}

function updateModeUI(){
  const testament = isTestamentMode();
  const trivia = isTriviaMode();
  const emoji = !testament && !trivia;
  document.getElementById("emojiCenter").style.display = emoji ? "flex" : "none";
  document.getElementById("testamentCenter").style.display = testament ? "flex" : "none";
  document.getElementById("triviaCenter").style.display = trivia ? "flex" : "none";
  document.getElementById("emojiControls").style.display = emoji ? "flex" : "none";
  document.getElementById("testamentControls").style.display = testament ? "flex" : "none";
  document.getElementById("triviaControls").style.display = trivia ? "flex" : "none";
  document.getElementById("categoryDisplay").innerText = CATEGORY_LABELS[selectedCategory] || "";
  document.getElementById("triviaRoundBanner").style.display = isTriviaTeamRoundMode() ? "block" : "none";

  const teamMode = isTriviaTeamRoundMode();
  document.getElementById("soloScoreWrap").style.display = teamMode ? "none" : "";
  document.getElementById("teamInfo").style.display = teamMode ? "none" : "";
  updateTeamScoreboard();
}

function updateTeamScoreboard(){
  const el = document.getElementById("teamScoreboard");
  if(!isTriviaTeamRoundMode()){
    el.style.display = "none";
    return;
  }
  el.style.display = "flex";
  el.innerHTML = scores.map((s, i) => {
    const cls = i === answeringTeamIndex ? "ts-current" : "";
    return "<span class=\"" + cls + "\">T" + (i + 1) + " " + (s || 0) + "</span>";
  }).join("");
}

function resumeTimer(){
  clearInterval(timer);
  timer = setInterval(()=>{
    time--;
    document.getElementById("time").innerText = time;
    if(time <= 0) endRound();
  },1000);
}

function startGameStopwatch(){
  gameElapsedSeconds = 0;
  stopwatchStarted = true;
  updateElapsedDisplay();
  clearInterval(gameTimer);
  gameTimer = setInterval(()=>{
    gameElapsedSeconds++;
    updateElapsedDisplay();
  },1000);
}

function resumeGameStopwatch(){
  clearInterval(gameTimer);
  gameTimer = setInterval(()=>{
    gameElapsedSeconds++;
    updateElapsedDisplay();
  },1000);
}

function updateElapsedDisplay(){
  const mm = Math.floor(gameElapsedSeconds / 60).toString().padStart(2,"0");
  const ss = (gameElapsedSeconds % 60).toString().padStart(2,"0");
  document.getElementById("time").innerText = mm + ":" + ss;
}

function updateTeamDisplay(){
  const el = document.getElementById("teamInfo");
  el.innerHTML = isIndividual ? "🙋 You" : ("🏆 T" + team);
}

function openCategoryModal(){
  clearInterval(timer);
  clearInterval(gameTimer);
  document.getElementById("inGameCategory").value = selectedCategory;
  document.getElementById("categoryModal").classList.add("show");
}

function applyCategoryChange(){
  selectedCategory = document.getElementById("inGameCategory").value;
  used = [];
  usedBooks = [];
  roundQuestionCount = 0;
  stealPending = false;
  answeringTeamIndex = team - 1;
  document.getElementById("categoryModal").classList.remove("show");
  updateModeUI();

  if(isTriviaTeamRoundMode() && !triviaQueuesInitialized){
    refillTypeQueues();
    roundQueue = [];
    roundQueuePointer = 0;
  }

  nextCard();

  if(isTriviaTeamRoundMode()){
    if(!stopwatchStarted){ startGameStopwatch(); } else { resumeGameStopwatch(); }
  } else {
    time = 60;
    resumeTimer();
  }
}

function cancelCategoryChange(){
  document.getElementById("categoryModal").classList.remove("show");
  if(isTriviaTeamRoundMode()){
    resumeGameStopwatch();
  } else {
    resumeTimer();
  }
}

function openPauseModal(){
  clearInterval(timer);
  clearInterval(gameTimer);
  const summary = document.getElementById("pauseSummary");
  summary.innerText = isTriviaTeamRoundMode()
    ? "Elapsed time: " + document.getElementById("time").innerText
    : "Time left: " + time + "s";
  document.getElementById("pauseModal").classList.add("show");
}

function resumeGame(){
  document.getElementById("pauseModal").classList.remove("show");
  if(isTriviaTeamRoundMode()){
    resumeGameStopwatch();
  } else {
    resumeTimer();
  }
}

function nextCard(){
  if(isTestamentMode()){
    nextBook();
    return;
  }

  if(isTriviaMode()){
    nextTrivia();
    return;
  }

  let pool = getCards();

  if(used.length === pool.length) used = [];

  let i;
  do {
    i = Math.floor(Math.random() * pool.length);
  } while(used.includes(i));

  used.push(i);

  currentCard = pool[i];

  document.getElementById("emoji").innerText = currentCard.e;
  document.getElementById("hint").innerText = currentCard.h ? ("(" + currentCard.h + ")") : "";
  document.getElementById("clue").innerText = "";

  document.getElementById("categoryDisplay").innerText =
    selectedCategory === "mixed" ? (CATEGORY_LABELS[currentCard.c] || "") : (CATEGORY_LABELS[selectedCategory] || "");
}

function nextBook(){
  if(usedBooks.length === BOOKS.length) usedBooks = [];

  let i;
  do {
    i = Math.floor(Math.random() * BOOKS.length);
  } while(usedBooks.includes(i));

  usedBooks.push(i);

  currentBook = BOOKS[i];

  document.getElementById("bookName").innerText = currentBook.name;
  document.getElementById("feedback").innerText = "";
}

function answerTestament(choice){
  if(!currentBook) return;

  const feedback = document.getElementById("feedback");

  if(choice === currentBook.t){
    score++;
    scores[team-1] = score;
    document.getElementById("score").innerText = score;
    feedback.innerText = "✅ Correct!";
    feedback.style.color = "#00c853";
  } else {
    const correctLabel = currentBook.t === "old" ? "Old Testament" : "New Testament";
    feedback.innerText = "❌ Wrong — it's " + correctLabel;
    feedback.style.color = "#e53935";
  }

  setTimeout(nextBook, 800);
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Some questions must be asked before a related one is fair game (e.g.
// "Who was never resurrected?" requires "someone was raised before Jesus"
// to have already come up). Moving that prerequisite to the front of its
// shuffled queue guarantees it's always the first of its type drawn, so
// the dependent question is virtually always already unlocked by the time
// its own turn comes up.
function pinPredecessorsFirst(arr){
  const requiredIds = new Set(TRIVIA.filter(t => t.requires).map(t => t.requires));
  if(requiredIds.size === 0) return arr;
  const pinned = [];
  const rest = [];
  arr.forEach(t => {
    if(t.id && requiredIds.has(t.id)) pinned.push(t); else rest.push(t);
  });
  return pinned.concat(rest);
}

function refillTriviaDeck(){
  triviaDeck = pinPredecessorsFirst(shuffleArray(TRIVIA));
  triviaPointer = 0;
}

function classifyTrivia(t){
  if(t.header === "Old or New Testament?") return "testament";
  if(t.header === "True or False?") return "tf";
  return "mc";
}

function refillTypeQueues(){
  const buckets = { mc: [], testament: [], tf: [] };
  TRIVIA.forEach(t => buckets[classifyTrivia(t)].push(t));
  triviaTypeQueues = {
    mc: pinPredecessorsFirst(shuffleArray(buckets.mc)),
    testament: pinPredecessorsFirst(shuffleArray(buckets.testament)),
    tf: pinPredecessorsFirst(shuffleArray(buckets.tf))
  };
  triviaQueuesInitialized = true;
}

function totalTriviaRemaining(){
  const inRound = Math.max(roundQueue.length - roundQueuePointer, 0);
  return inRound + triviaTypeQueues.mc.length + triviaTypeQueues.testament.length + triviaTypeQueues.tf.length;
}

function topicsOf(t){
  return t.topics || [];
}

function sharesTopic(t, usedTopics){
  return topicsOf(t).some(top => usedTopics.has(top));
}

// Some questions are only fair to ask after a related one has already come
// up (e.g. "Who was never resurrected?" should only appear once the
// "someone was raised before Jesus" question has already been asked).
function isTriviaAvailable(t){
  return !t.requires || resolvedTriviaIds.has(t.requires);
}

function markTriviaResolved(t){
  if(t && t.id) resolvedTriviaIds.add(t.id);
}

// Pulls a question from the given type queue, preferring one that's both
// available (its prerequisite, if any, has already been asked) and whose
// topic doesn't overlap with what's already in the round (e.g. avoids
// pairing "Who challenged the prophets of Baal?" with "True/False: Elijah
// challenged the prophets of Baal" in the same round). Falls back in
// stages so the round never stalls waiting on a constraint.
function takeNonConflicting(type, usedTopics){
  const queue = triviaTypeQueues[type];
  for(let i = 0; i < queue.length; i++){
    if(isTriviaAvailable(queue[i]) && !sharesTopic(queue[i], usedTopics)){
      return queue.splice(i, 1)[0];
    }
  }
  for(let i = 0; i < queue.length; i++){
    if(isTriviaAvailable(queue[i])){
      return queue.splice(i, 1)[0];
    }
  }
  return queue.shift();
}

function buildRoundQueue(){
  if(!triviaQueuesInitialized) refillTypeQueues();

  const remaining = totalTriviaRemaining();
  const roundSize = Math.min(ROUND_QUESTIONS_PER_TEAM, remaining);
  const picks = [];
  const usedTopics = new Set();
  const types = ["tf", "testament", "mc"];

  function addPick(t){
    picks.push(t);
    topicsOf(t).forEach(top => usedTopics.add(top));
  }

  // Guarantee one of each type first, if available.
  types.forEach(type => {
    if(picks.length < roundSize && triviaTypeQueues[type].length > 0){
      addPick(takeNonConflicting(type, usedTopics));
    }
  });

  // Fill any remaining slots randomly from whichever type queues still have items.
  while(picks.length < roundSize){
    const available = types.filter(type => triviaTypeQueues[type].length > 0);
    if(available.length === 0) break;
    const pick = available[Math.floor(Math.random() * available.length)];
    addPick(takeNonConflicting(pick, usedTopics));
  }

  roundQueue = shuffleArray(picks);
  roundQueuePointer = 0;
}

function nextTrivia(){
  if(isTriviaTeamRoundMode()){
    if(roundQueuePointer >= roundQueue.length){
      buildRoundQueue();
    }
    currentTrivia = roundQueue[roundQueuePointer++];
  } else {
    if(triviaDeck.length === 0 || triviaPointer >= triviaDeck.length){
      refillTriviaDeck();
    }
    // Skip forward (without breaking the no-repeat shuffle) to the next
    // question whose prerequisite, if any, has already been asked.
    let idx = triviaPointer;
    while(idx < triviaDeck.length - 1 && !isTriviaAvailable(triviaDeck[idx])){
      idx++;
    }
    if(!isTriviaAvailable(triviaDeck[idx])) idx = triviaPointer;
    [triviaDeck[triviaPointer], triviaDeck[idx]] = [triviaDeck[idx], triviaDeck[triviaPointer]];
    currentTrivia = triviaDeck[triviaPointer++];
  }

  markTriviaResolved(currentTrivia);

  const headerEl = document.getElementById("quizHeader");
  const nameEl = document.getElementById("quizName");
  const detailEl = document.getElementById("quizDetail");

  nameEl.classList.toggle("quiz-statement", currentTrivia.header === "True or False?");

  if(currentTrivia.header){
    headerEl.innerText = currentTrivia.header;
    headerEl.style.display = "block";
    nameEl.innerText = currentTrivia.name;
    if(currentTrivia.detail){
      detailEl.innerText = currentTrivia.detail;
      detailEl.style.display = "block";
    } else {
      detailEl.innerText = "";
      detailEl.style.display = "none";
    }
  } else {
    headerEl.style.display = "none";
    nameEl.innerText = currentTrivia.q;
    detailEl.style.display = "none";
  }

  document.getElementById("triviaFeedback").innerText = "";

  for(let idx = 0; idx < 4; idx++){
    const btn = document.getElementById("opt" + idx);
    if(idx < currentTrivia.options.length){
      btn.innerText = currentTrivia.options[idx];
      btn.style.display = "flex";
    } else {
      btn.innerText = "";
      btn.style.display = "none";
    }
  }
  document.getElementById("optRow2").style.display = currentTrivia.options.length > 2 ? "flex" : "none";

  if(isTriviaTeamRoundMode()){
    stealPending = false;
    answeringTeamIndex = team - 1;
    updateRoundInfo();
    updateScoreDisplay();
  }
}

function answerTrivia(choice){
  if(!currentTrivia) return;

  if(isTriviaTeamRoundMode()){
    answerTriviaTeamMode(choice);
    return;
  }

  const feedback = document.getElementById("triviaFeedback");

  if(choice === currentTrivia.a){
    score++;
    scores[team-1] = score;
    document.getElementById("score").innerText = score;
    feedback.innerText = "✅ Correct!";
    feedback.style.color = "#00c853";
  } else {
    feedback.innerText = revealText(currentTrivia);
    feedback.style.color = "#e53935";
  }

  setTimeout(nextTrivia, 900);
}

function revealText(trivia){
  const answerLabel = trivia.options[trivia.a];
  return trivia.explanation
    ? "❌ Wrong — it's " + answerLabel + " (" + trivia.explanation + ")"
    : "❌ Wrong — it's " + answerLabel;
}

function answerTriviaTeamMode(choice){
  const feedback = document.getElementById("triviaFeedback");
  const correct = choice === currentTrivia.a;
  const answeringIdx = answeringTeamIndex;

  if(correct){
    scores[answeringIdx] = (scores[answeringIdx] || 0) + 1;
    updateScoreDisplay();
    feedback.innerText = "✅ Correct! Team " + (answeringIdx + 1) + " scores!";
    feedback.style.color = "#00c853";
    advanceAfterAnswer();
  } else if(!stealPending && teamCount > 1){
    stealPending = true;
    answeringTeamIndex = team % teamCount;
    feedback.innerText = "❌ Wrong! Team " + (answeringTeamIndex + 1) + " can steal!";
    feedback.style.color = "#ffca28";
    updateRoundInfo();
    updateScoreDisplay();
  } else {
    feedback.innerText = revealText(currentTrivia);
    feedback.style.color = "#e53935";
    advanceAfterAnswer();
  }
}

function advanceAfterAnswer(){
  roundQuestionCount++;

  if(isTriviaTeamRoundMode() && totalTriviaRemaining() === 0){
    // Every question in the question bank has now been asked — game over.
    setTimeout(showResults, 1100);
    return;
  }

  if(roundQueuePointer >= roundQueue.length){
    setTimeout(endRound, 1100);
  } else {
    setTimeout(nextTrivia, 1100);
  }
}

function updateRoundInfo(){
  if(!isTriviaTeamRoundMode()) return;

  document.getElementById("roundOwnerLabel").innerText = "🏆 Team " + team + "'s Round";

  const answeringEl = document.getElementById("answeringLabel");
  if(answeringTeamIndex === team - 1){
    answeringEl.innerText = "▶ Team " + team + " Answering";
    answeringEl.classList.remove("steal");
  } else {
    answeringEl.innerText = "🔁 STEAL! Team " + (answeringTeamIndex + 1) + " Answering";
    answeringEl.classList.add("steal");
  }

  document.getElementById("questionProgress").innerText =
    "Question " + Math.min(roundQuestionCount + 1, roundQueue.length) + " of " + roundQueue.length;
}

function updateScoreDisplay(){
  if(!isTriviaTeamRoundMode()) return;
  document.getElementById("score").innerText = scores[answeringTeamIndex] || 0;
  updateTeamScoreboard();
}

function revealAnswer(){
  if(!currentCard) return;

  document.getElementById("clue").innerText = " " + currentCard.a;
}

function correct(){
  score++;
  scores[team-1] = score;
  document.getElementById("score").innerText = score;
  nextCard();
}

function skip(){
  nextCard();
}

function endGame(){
  clearInterval(timer);
  clearInterval(gameTimer);
  showResults();
}

function endRound(){
  clearInterval(timer);

  if(isTriviaTeamRoundMode()){
    // Deck exhaustion is already handled in advanceAfterAnswer() before this
    // is ever called, so getting here always means there are more questions
    // left — keep cycling through teams instead of stopping after one pass.
    const finishedTeam = team;
    team = (team % teamCount) + 1;
    document.getElementById("nextTeam").innerText = team;

    const recap = document.getElementById("betweenRecap");
    recap.innerText = "Score so far — Team " + finishedTeam + ": " + (scores[finishedTeam - 1] || 0) + " point(s).";

    document.getElementById("game").classList.remove("show");
    document.getElementById("between").classList.add("show");
    return;
  }

  if(team < teamCount){
    team++;
    document.getElementById("nextTeam").innerText = team;
    document.getElementById("betweenRecap").innerText = "";
    document.getElementById("game").classList.remove("show");
    document.getElementById("between").classList.add("show");
  } else {
    showResults();
  }
}

function nextTeam(){
  document.getElementById("between").classList.remove("show");
  document.getElementById("game").classList.add("show");
  startRound();
}

function showResults(){
  clearInterval(timer);
  clearInterval(gameTimer);

  document.getElementById("game").classList.remove("show");
  document.getElementById("between").classList.remove("show");
  document.getElementById("end").classList.add("show");

  if(isIndividual){
    document.getElementById("results").innerHTML = "";
    document.getElementById("winner").innerText = "Final Score: " + scores[0] + " 🎉";
    return;
  }

  let table = "";
  let max = 0;
  let winner = 1;

  scores.forEach((s,i)=>{
    if(s > max){
      max = s;
      winner = i+1;
    }
    table += `<tr><td>Team ${i+1}</td><td>${s}</td></tr>`;
  });

  document.getElementById("results").innerHTML = table;
  document.getElementById("winner").innerText = "Team " + winner + " Wins 🎉";
}
</script>
